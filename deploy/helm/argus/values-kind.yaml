# Overlay for installing the chart on the kind dev cluster. make dev-up does
# not use it: it applies deploy/kind/argus-engine.yaml.
image:
  repository: argus-engine
  tag: dev
  pullPolicy: Never # image is `kind load`-ed, never pulled

engine:
  apiToken: argus-dev-token

networkPolicy:
  enabled: false # kind's default CNI (kindnet) enforces nothing anyway

resources:
  requests:
    cpu: 50m
    memory: 64Mi
