# Default values for the argus chart.

# Every release after v1.0.0 publishes this image for amd64 and arm64, tagged
# with the chart's appVersion. v1.0.0 has none: for it, build engine/Dockerfile,
# push it to a registry your cluster can pull from, and set repository and tag.
image:
  repository: ghcr.io/tamen25/argus
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1

engine:
  # HTTP API / health / metrics listen address.
  addr: ":8080"
  # Bearer token for the engine API (§5.3: required; plugin backend is the
  # only documented caller). If empty, the chart generates one at install.
  apiToken: ""
  # The OTLP gRPC receiver for the sampled mirror (point a second Alloy or
  # Collector exporter here). There is no OTLP/HTTP receiver.
  otlp:
    grpcPort: 4317

service:
  type: ClusterIP
  port: 8080

# §5.3: NetworkPolicies ship with the chart, default on. They only take
# effect on a CNI that enforces them (kind's default kindnet does not).
networkPolicy:
  enabled: true
  # Namespaces allowed to reach the engine API (Grafana runs here).
  allowedNamespaces:
    - lgtm
  # Namespaces allowed to send OTLP (where the Alloy or Collector that mirrors
  # telemetry runs). The receiver has no authentication: this policy is what
  # decides who may report telemetry, and so who can affect the scores.
  otlpAllowedNamespaces:
    - lgtm

serviceAccount:
  create: true
  name: ""

# A ServiceMonitor for the score gauges on /metrics (Prometheus Operator).
# Off by default: it needs the operator's CRD.
serviceMonitor:
  enabled: false
  # Labels the operator selects ServiceMonitors by, e.g. kube-prometheus-stack
  # selects `release: <its release name>` unless told otherwise.
  labels: {}
  # Matches the engine's default --score-interval.
  interval: 30s

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
