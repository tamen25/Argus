# Default values for the argus chart.

# No engine image is published yet (BACKLOG B-61). Build engine/Dockerfile,
# push it to a registry your cluster can pull from, and set repository and
# tag to it.
image:
  repository: ghcr.io/tamen25/argus
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1

engine:
  # HTTP API / health / metrics listen address.
  addr: ":8080"
  # Bearer token for the engine API (§5.3: required; plugin backend is the
  # only documented caller). If empty, the chart generates one at install.
  apiToken: ""
  # The OTLP gRPC receiver for the sampled mirror (point a second Alloy or
  # Collector exporter here). There is no OTLP/HTTP receiver.
  otlp:
    grpcPort: 4317

service:
  type: ClusterIP
  port: 8080

# §5.3: NetworkPolicies ship with the chart, default on. They only take
# effect on a CNI that enforces them (kind's default kindnet does not).
networkPolicy:
  enabled: true
  # Namespaces allowed to reach the engine API (Grafana runs here).
  allowedNamespaces:
    - lgtm
  # Namespaces allowed to send OTLP (where the Alloy or Collector that mirrors
  # telemetry runs). The receiver has no authentication: this policy is what
  # decides who may report telemetry, and so who can affect the scores.
  otlpAllowedNamespaces:
    - lgtm

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

postgresql:
  enabled: true
  auth:
    database: argus
    username: argus
    # Dev default; override with existingSecret in real deployments.
    password: argus-dev
  primary:
    persistence:
      size: 5Gi
