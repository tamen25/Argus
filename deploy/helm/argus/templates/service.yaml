apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}
  labels: {{- include "argus.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "argus.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    # The sampled OTLP mirror (gRPC only: the engine has no OTLP/HTTP receiver).
    - name: otlp-grpc
      port: {{ .Values.engine.otlp.grpcPort }}
      targetPort: otlp-grpc
