{{- if .Values.networkPolicy.enabled }}
# §5.3: the engine API is reachable only from the allowed namespaces (Grafana's
# plugin backend is its only documented caller), and the OTLP receiver only
# from the namespaces that mirror telemetry to it. Each port is opened to its
# own callers. Pods in the release namespace (postgres, jobs) reach the API.
#
# The receiver has no authentication, so this policy is the trust boundary for
# OTLP: any pod allowed here can report any service name. It only holds on a
# CNI that enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "argus.fullname" . }}
  labels: {{- include "argus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "argus.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        - podSelector: {}
    {{- /* A rule with no "from" admits every source, so with no namespaces
         listed the OTLP port gets no rule at all, and stays closed. */}}
    {{- with .Values.networkPolicy.otlpAllowedNamespaces }}
    - ports:
        - port: otlp-grpc
      from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
