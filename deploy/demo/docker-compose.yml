# `make demo`: the engine, Postgres, and grafana/otel-lgtm (Grafana with a
# mini Loki, Tempo, Mimir and Collector in one image), without a cluster.
#
# What it does not do yet: install the Argus plugin in Grafana, or point the
# Collector's sampled mirror at the engine's OTLP port. Send OTLP to
# localhost:4317 yourself to see scores at http://localhost:8080/api/report.
# Every port is bound to localhost: this is a local demo.
name: argus-demo

services:
  engine:
    build:
      context: ../../engine
    # The API is open (no ARGUS_API_TOKEN), which serve allows on a
    # non-loopback address only with --insecure-no-auth; the host ports
    # below are bound to localhost.
    command: ["serve", "--addr", ":8080", "--otlp-grpc", ":4317", "--insecure-no-auth"]
    ports:
      - "127.0.0.1:8080:8080" # API, /healthz, /metrics
      - "127.0.0.1:4317:4317" # OTLP gRPC receiver
    healthcheck:
      # The image is distroless (no shell, no curl): the binary checks itself.
      test: ["CMD", "argus", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus-dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 3s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:0.34.0 # pinned: latest changes under you
    ports:
      - "127.0.0.1:3000:3000" # Grafana
      - "127.0.0.1:14317:4317" # OTLP gRPC (offset from the engine's, and from kind's)
      - "127.0.0.1:14318:4318" # OTLP HTTP

volumes:
  pgdata:
