# grafana/otel-lgtm 0.34.0's Collector config, with one addition: every
# signal is also sent to the Argus engine (otlp_grpc/argus), the "sampled
# mirror" a real deployment gets from a second Alloy or Collector exporter.
# The demo mirrors everything, unsampled. Everything else is the image's
# config unchanged; compare with /otel-lgtm/otelcol-config.yaml in the image
# when upgrading it.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true
  # The mirror to the Argus engine (the compose service "engine").
  otlp_grpc/argus:
    endpoint: engine:4317
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces, otlp_grpc/argus]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [batch]
      exporters: [otlp_http/metrics, otlp_grpc/argus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs, otlp_grpc/argus]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
