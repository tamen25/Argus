# Bench scenario on the CloudOps mesh (environment cloudops; run with
# --inject-namespace cloudops, see README "CloudOps mesh"). Fault: payment is
# redeployed with an empty OTEL_SERVICE_NAME.
#
# Nothing errors. Orders complete; payment's telemetry still arrives, but
# under unknown_service:<process>, so payment seems to stop reporting while an
# unnamed service appears between the gateway and ledger. An agent looking
# for a failure finds none; the evidence is traffic that is still there under
# another name.
#
# Validated 2026-11-05 on CloudOps's EKS cluster with the cited stub (B-62):
# target_info appeared under job unknown_service:node during the fault (none
# at baseline) and aged out of the [2m] window after payment was restored.
apiVersion: argus/v1alpha1
kind: BenchScenario
metadata:
  name: cloudops-missing-service-name-payment
  description: >-
    payment is redeployed with an empty OTEL_SERVICE_NAME. Orders still
    complete, but payment's telemetry now arrives as unknown_service and
    payment appears to stop reporting.
spec:
  environment:
    app: cloudops
  inject:
    - type: script
      script: faults/cloudops-load.sh
      duration: 10m
    - type: script
      script: faults/cloudops-missing-service-name-payment.sh
      duration: 10m
  # No CloudOps service is unnamed in the baseline: each sets
  # OTEL_SERVICE_NAME, and inventory names itself in code.
  steadyState:
    query: count(count_over_time(target_info{job=~"unknown_service.*"}[2m]))
    min: 1
    settle: 30s
  reset:
    - script: faults/restore-all-mutations.sh
    - script: faults/cloudops-load-stop.sh
  cleanup:
    - script: faults/restore-all-mutations.sh
    - script: faults/cloudops-load-stop.sh
  groundTruth:
    rootCauseEntities:
      - {kind: Deployment, namespace: cloudops, name: payment}
    category: missing-service-name
    # ledger's caller becomes the unnamed service, and the gateway's calls
    # land on it; either reads as the service that changed.
    decoys:
      - {kind: Deployment, namespace: cloudops, name: ledger}
      - {kind: Deployment, namespace: cloudops, name: api-gateway}
  scoring:
    entityMatch: jaccard
    partialCredit: true
    categoryWeight: 0.5
    requireEvidence: true
