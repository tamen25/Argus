name: Release

# Pushing a vX.Y.Z tag builds the engine for six platforms and the Grafana
# plugin zip, and attaches both to a DRAFT GitHub release. A maintainer pastes
# the hand-written notes and publishes it; nothing here publishes on its own.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Engine binaries + plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser reads the tag and commit timestamp
      - uses: actions/setup-go@v7
        with:
          # Same pin as CI: go.mod's toolchain line decides the stdlib a
          # released binary ships with.
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.sum
            plugin/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Plugin frontend
        working-directory: plugin
        run: |
          npm ci
          # plugin.json's %VERSION% is filled from package.json at build time.
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm run build
          # goreleaser refuses a dirty tree; the version bump only had to reach
          # the build.
          git checkout -- package.json package-lock.json
      - name: Plugin backend (all platforms)
        uses: magefile/mage-action@v4
        with:
          version: latest
          args: -v
          workdir: plugin
      - name: Sign plugin (only when a Grafana access policy token is configured)
        working-directory: plugin
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          if [ -n "$GRAFANA_ACCESS_POLICY_TOKEN" ]; then
            npx --yes @grafana/sign-plugin@latest
          else
            echo "::warning::GRAFANA_ACCESS_POLICY_TOKEN not set; the plugin zip is unsigned"
          fi
      - name: Package plugin zip
        # Staged outside the checkout: an untracked file would make the tree
        # dirty, and goreleaser refuses to release from a dirty tree.
        run: |
          id="$(jq -r .id plugin/dist/plugin.json)"
          out="$RUNNER_TEMP/plugin-release"
          mkdir -p "$out"
          cp -r plugin/dist "$out/${id}"
          (cd "$out" && zip -qr "${id}-${GITHUB_REF_NAME#v}.zip" "${id}" && rm -rf "${id}")
          ls -l "$out"
          echo "PLUGIN_RELEASE_DIR=$out" >> "$GITHUB_ENV"

      - name: Instrumentation Score spec pin
        run: echo "ARGUS_SPEC_VERSION=$(tr -d '[:space:]' < .instrumentation-score-version)" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
