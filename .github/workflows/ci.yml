name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod's `toolchain` line is the single source of truth: stdlib
          # vulnerabilities follow the Go that builds the binary, so CI and a
          # local build must agree on it. `stable` let an upstream release change
          # the build (and fail CI) with no change to this repo.
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: golangci-lint (incl. depguard architecture rules)
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: `latest` let a new linter release fail CI on unchanged code.
          # Bump deliberately, and keep it built for the same Go minor as
          # go.mod's toolchain or it panics loading the standard library.
          version: v2.14.0
          working-directory: engine
      - name: govulncheck (fails only on vulnerabilities our code can reach)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Builtin rules in sync with /rules
        run: |
          go run ./tools/syncrules
          git diff --exit-code -- internal/rules/builtin || {
            echo "::error::embedded builtin rules drifted from /rules — run 'make rules-sync' and commit"; exit 1; }
      - name: Test
        run: |
          set -o pipefail
          go test -race -cover ./... | tee "$RUNNER_TEMP/cover.out"
      - name: Coverage gate (>=70% on the deterministic core)
        run: ../scripts/coverage-gate.sh "$RUNNER_TEMP/cover.out"
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o bin/argus ./cmd/argus

  plugin:
    name: Plugin (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Build frontend
        run: npm run build
      # ./pkg/... rather than ./...: Go does not skip node_modules, and the
      # npm package `flatted` ships a Go package that ./... would pick up.
      - name: Build backend
        run: go build ./pkg/...
      - name: govulncheck (backend runs inside Grafana)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./pkg/...

  dogfood:
    name: Dogfood gate (argus scores itself)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o argus ./cmd/argus
      - name: Score the engine's own telemetry (gate at 85)
        run: |
          # One argus scores another: the scorer listens, the subject serves
          # with OTLP self-export pointed at the scorer. Master plan §3.4 —
          # Argus must pass its own rules, and this is where that's enforced.
          ./argus score --listen-otlp 127.0.0.1:4319 --window 60s \
            --fail-below-score 85 \
            --spec-version-file ../.instrumentation-score-version \
            --out dogfood-report.md &
          SCORE_PID=$!
          sleep 2
          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4319 ARGUS_ENVIRONMENT=ci \
            ./argus serve --addr 127.0.0.1:8099 --otlp-grpc 127.0.0.1:4320 \
            --score-interval 3s &
          SERVE_PID=$!
          set +e
          wait "$SCORE_PID"; RC=$?
          set -e
          kill "$SERVE_PID" 2>/dev/null || true
          echo "--- dogfood report ---"
          cat dogfood-report.md
          exit "$RC"

  release-config:
    name: Release config (goreleaser check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The release workflow runs only on a tag, so a broken .goreleaser.yaml
      # would otherwise surface at release time. Same goreleaser line as there.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
        env:
          PLUGIN_RELEASE_DIR: ${{ runner.temp }}
          ARGUS_SPEC_VERSION: check

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: helm lint
        run: |
          helm dependency update deploy/helm/argus
          helm lint deploy/helm/argus
          helm template argus deploy/helm/argus >/dev/null
