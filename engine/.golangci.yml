# golangci-lint v2 config for the Argus engine.
# Binding architecture rule 2 (master plan §5.1): deterministic core, LLM at the edge —
# rules/, cost/, backtest/, bench (except the flagged normalization path) never
# import the LLM client. Enforced here via depguard; CI runs this on every PR.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose # an unclosed HTTP body leaks the connection
    - depguard
    - errorlint # wrapped errors compared with errors.Is/As, never ==
    - gosec
    - misspell
    - nilerr # returning nil while holding an error: intentional cases say so with //nolint
    - noctx # outbound calls and listeners take a context, so they can be cancelled
    - unconvert
    - unparam
  settings:
    gosec:
      # Excluded rule by rule, each for a reason that holds everywhere in this
      # codebase. Anything else gosec reports must be fixed, or justified with
      # a //nolint:gosec comment at the line.
      excludes:
        - G304 # reading a file the user named on the command line is what a CLI does
    depguard:
      rules:
        deterministic-core:
          list-mode: lax # allow everything not explicitly denied
          files:
            - "**/internal/rules/**"
            - "**/internal/cost/**"
            - "**/internal/backtest/**"
            - "**/internal/bench/scoring/**"
            - "**/internal/bench/leaderboard/**"
            - "**/internal/calibrate/**"
            - "**/internal/stats/**"
          deny:
            - pkg: github.com/tamen25/Argus/engine/internal/remediate/llm
              desc: "deterministic core must not import the LLM client (architecture rule 2)"
  exclusions:
    rules:
      # Tests build URLs, files and fixtures from variables by design.
      - path: _test\.go
        linters: [gosec, noctx]
      # math/rand seeds deterministic synthetic history: nothing there is
      # secret, and it must be reproducible from the spec's seed.
      - path: internal/synthhist/
        text: G404

formatters:
  enable:
    - gofmt
    - goimports
