# Argus remediation: missing-metric-unit — MET-001 on "checkout"
# Generated by `argus remediate` — review before applying.
#
# PREFERRED FIX (do this instead if you own the workload): pass the unit when
# the instrument is created (e.g. unit "s", "By", "{request}"; UCUM codes).
#
# The patch below sets a unit at the collector for one metric. Argus cannot
# know what the metric measures: replace REPLACE_WITH_UCUM_UNIT with the right
# code, and repeat the statement for each metric the finding lists.

processors:
  transform/argus_metric_unit_checkout:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - set(unit, "REPLACE_WITH_UCUM_UNIT") where name == "http_requests_total" and unit == ""

