# Argus remediation: broken-context-propagation — SPA-004 on "payment"
# 15% of observed traces or spans were affected.
# Generated by `argus remediate` — review before applying.
#
# HONEST NOTE: a collector cannot repair trace context. A span that arrives
# without its parent, or a server that started a new trace instead of
# continuing the caller's, was produced that way by the application. The fix
# is in the workload:
#   1. Use one propagation format across every service, e.g.
#        OTEL_PROPAGATORS=tracecontext,baggage
#      and check nothing sets it to "none".
#   2. Instrument both ends of each hop: the inbound server (HTTP, gRPC,
#      messaging consumer) and the outbound client, so context is extracted
#      and injected.
#   3. For async work (queues, background jobs), carry the context in the
#      message and start the consumer span as a child or a link.
#   4. Check proxies and gateways between services forward the traceparent
#      and tracestate headers.
#
# There is no collector configuration to generate for this finding.
